---
# 审计日志服务 - 本地/CI Docker Compose 编排
# 包含：
#   audit-trail-api  : FastAPI 服务（速率限制 + DB 级不可篡改）
#   prometheus       : 指标采集（已内置 /metrics 端点）
# 数据持久化：
#   audit-data       : SQLite 文件挂载点（/data）
#   prometheus-data  : Prometheus TSDB
#
# 用法：
#   docker compose up -d --build        # Compose v2 (推荐)
#   docker-compose up -d --build        # Compose v1 (1.29.x)
#   docker compose logs -f audit-trail-api
#   docker compose exec audit-trail-api alembic current
#   docker compose down -v              # 停止并删除所有数据卷
#
# 注意：Compose v1 (1.29.x) 不识别「name:」和「depends_on.condition: service_started」
#       已做兼容处理——直接用本文件即可。
# ------------------------------------------------------------------
# name: audit-trail      # Compose v2 专属；若使用 v2，请取消注释

version: "3.8"

services:
  audit-trail-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: 0.4.0
    image: audit-trail-api:0.4.0
    container_name: audit-trail-api
    restart: unless-stopped
    tty: true
    ports:
      - "8000:8000"
    # depends_on 在 v1 中只表达「启动顺序」，不做健康检查依赖
    depends_on:
      - prometheus
    environment:
      # 可复制 .env.example 到 .env 并在此引用 env_file
      - DEBUG=false
      - APP_NAME=Audit Trail Service (Docker)
      - APP_VERSION=0.4.0
      - DATABASE_URL=sqlite:////data/audit_trail.db
      - DATABASE_ECHO=false
      - SECRET_KEY=docker-compose-change-me-please-use-256-bit-random
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - API_V1_PREFIX=/api/v1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - CORS_ORIGINS=["*"]
      # 速率限制
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_EVENTS_PER_MINUTE_IP=60
      - RATE_LIMIT_EVENTS_PER_MINUTE_ACTOR=60
      - RATE_LIMIT_BULK_FACTOR=10
      # 审计不可篡改（由触发器硬约束，本 flag 预留）
      - AUDIT_IMMUTABLE=true
      # uvicorn worker 数
      - WORKERS=2
    volumes:
      # SQLite 数据库持久化卷
      - audit-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - audit-net
    security_opt:
      - no-new-privileges:true
    read_only: false
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: audit-prometheus
    restart: unless-stopped
    user: "65534:65534"   # nobody
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - audit-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"

volumes:
  audit-data:
    # Compose v2: name: audit-trail-data
    driver: local
  prometheus-data:
    # Compose v2: name: audit-prometheus-data
    driver: local

networks:
  audit-net:
    # Compose v2: name: audit-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
